name: Diagnose sealed release hashes

on:
  push:
    branches: [agent/41-22-3-clean-ci-bounds]
    paths:
      - .github/workflows/diagnose-release-hashes.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnose-release-hashes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record exact repository bytes and checksum differences
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p hash-ledger
          printf '%s\n' 'Copyright © 2026 Gateway Information Group LLC. All rights reserved.' > hash-ledger/RIGHTS_NOTICE.txt
          find . -type f \
            ! -path './.git/*' \
            ! -path './hash-ledger/*' \
            ! -path './.github/workflows/diagnose-release-hashes.yml' \
            ! -name 'SHA256SUMS.txt' \
            -printf '%P\0' \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum > hash-ledger/ACTUAL_SHA256SUMS.txt
          set +e
          sha256sum --check SHA256SUMS.txt > hash-ledger/VERIFY_OUTPUT.txt 2>&1
          rc=$?
          set -e
          printf 'verify_exit_code=%s\n' "$rc" > hash-ledger/RESULT.txt
          awk '/FAILED|No such file|WARNING/ {print}' hash-ledger/VERIFY_OUTPUT.txt > hash-ledger/FAILURES_ONLY.txt || true
          git rev-parse HEAD > hash-ledger/HEAD_SHA.txt

      - name: Upload bounded hash ledger
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: sealed-release-hash-ledger-${{ github.run_id }}
          path: hash-ledger
          if-no-files-found: error
          compression-level: 9
          retention-days: 3

# Copyright © 2026 Gateway Information Group LLC. All rights reserved.
