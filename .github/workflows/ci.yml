name: Public edition validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify managed source
        run: python -I -S -B run_sell_preview.py --verify
      - name: Run deterministic tests
        run: python -B -m unittest discover -s tests -v
      - name: Demonstrate synthetic plan
        run: python -I -S -B run_sell_preview.py --demo
      - name: Exercise Windows launch and independent export
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cd /d "%TEMP%"
          call "%GITHUB_WORKSPACE%\Kalshi15mSellPreview.bat" --demo
          if errorlevel 1 exit /b 1
          call "%GITHUB_WORKSPACE%\Kalshi15mSellPreview_Export.bat"
          if errorlevel 1 exit /b 1
