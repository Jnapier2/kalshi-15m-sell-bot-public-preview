name: Maintenance source export

on:
  push:
    branches: [agent/41-22-3-ci-bounds]
    paths:
      - .github/workflows/maintenance-source-export.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintenance-source-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact maintenance revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Stage source without the temporary exporter
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p maintenance-export/source
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/workflows/maintenance-source-export.yml' \
            ./ maintenance-export/source/
          git rev-parse HEAD > maintenance-export/HEAD_SHA.txt
          printf '%s\n' \
            'Copyright © 2026 Gateway Information Group LLC. All rights reserved.' \
            > maintenance-export/RIGHTS_NOTICE.txt
          find maintenance-export/source -type f -printf '%P\n' | LC_ALL=C sort \
            > maintenance-export/SOURCE_FILES.txt

      - name: Upload bounded maintenance source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: kalshi-preview-maintenance-source-${{ github.run_id }}
          path: maintenance-export
          if-no-files-found: error
          compression-level: 9
          retention-days: 3

# Copyright © 2026 Gateway Information Group LLC. All rights reserved.
