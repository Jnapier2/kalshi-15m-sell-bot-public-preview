# Review-only dependency monitoring. Dependabot never auto-merges; every update
# must pass the hash locks, SBOM, sealed inventory, security matrix, and checksums.
# Copyright © 2026 Gateway Information Group LLC. All rights reserved.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "security-review-required"
    groups:
      compatible-python-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "security-review-required"
    groups:
      compatible-action-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "ci"
